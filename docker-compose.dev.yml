# 本地开发用 PostgreSQL（仅数据库，不含应用）
# 匹配项目 .env.local 的连接配置：
#   postgresql://student_leave:tj875891..@localhost:5432/student_leave
#
# 使用：
#   启动：docker compose -f docker-compose.dev.yml up -d
#   停止：docker compose -f docker-compose.dev.yml down
#   清空数据：docker compose -f docker-compose.dev.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-leave-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: student_leave
      POSTGRES_PASSWORD: "tj875891.."
      POSTGRES_DB: student_leave
      # PGDATA 使用子目录，避免直接挂到数据卷根目录的初始化权限问题
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - student-leave-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_leave -d student_leave"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  student-leave-pgdata:
    name: student-leave-pgdata
